<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Builder Admin</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background-color: #f4f7f6;
        margin: 0;
        padding: 2rem;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }
      .form-section {
        padding: 2rem;
        border-bottom: 1px solid #eee;
      }
      .list-section {
        padding: 2rem;
      }
      h1,
      h2 {
        color: #333;
        margin-top: 0;
      }
      h1 {
        font-size: 1.8rem;
      }
      h2 {
        font-size: 1.4rem;
      }

      /* Form Styles */
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #555;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box; /* Important */
        font-size: 1rem;
      }
      .form-group textarea {
        min-height: 120px;
        font-family: inherit;
      }
      .btn {
        background-color: #007bff;
        color: white;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #0056b3;
      }

      /* Agent List Styles */
      .agent-list {
        list-style-type: none;
        padding: 0;
      }
      .agent-item {
        background-color: #fafafa;
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1rem;
      }
      .agent-item h3 {
        margin: 0 0 0.5rem 0;
        color: #007bff;
      }
      .agent-item p {
        margin: 0;
        color: #666;
        white-space: pre-wrap; /* Shows instructions with new lines */
      }
      .no-agents {
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-section">
        <h1>IntelliVerse Agent Builder </h1>
        <h2>Create New Agent</h2>

        <form action="/" method="POST">
          <div class="form-group">
            <label for="agent_name">Agent Name</label>
            <input
              type="text"
              id="agent_name"
              name="agent_name"
              placeholder="e.g., History Expert"
              required
            />
          </div>
          <div class="form-group">
            <label for="agent_instructions">Instructions</label>
            <textarea
              id="agent_instructions"
              name="agent_instructions"
              placeholder="e.g., You are a helpful assistant..."
              required
            ></textarea>
          </div>
          <button type="submit" class="btn">Create Agent</button>
        </form>
      </div>

      <div class="list-section">
        <h2>Existing Agents</h2>

        <ul class="agent-list">
          {% if agents %} {% for agent in agents %}
      <li class="agent-item">
                        <h3>{{ agent.name }}</h3>
                        <p>{{ agent.instructions }}</p>
                        
                        <a href="/agent/{{ agent.id }}" class="btn" style="display:inline-block; text-decoration:none; font-size:0.9rem;">Chat</a>
                        
                        <form action="/delete/{{ agent.id }}" method="POST" style="display:inline; margin-left: 10px;">
                            <button type="submit" class="btn" style="background-color: #dc3535; cursor: pointer;">Delete</button>
                        </form>
                    </li>
          {% endfor %} {% else %}
          <li class="no-agents">No agents created yet.</li>
          {% endif %}
        </ul>
      </div>
    </div>
  </body>
</html>
