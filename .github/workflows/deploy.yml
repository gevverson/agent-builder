name: Build, Test, and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Get the code
    - uses: actions/checkout@v3
    
    # 2. Set up Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    # 3. Install libraries
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    # 4. Test the App (Smoke Test)
    - name: Test Run
      run: |
        python -c "from app import create_app; print('App initialized successfully')"
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    # 5. THE NEW PART: Trigger PythonAnywhere to Update
    # If the tests pass, GitHub sends a POST request to your server
    - name: Deploy to PythonAnywhere
      env:
        DEPLOY_WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL }}
      run: |
        curl -X POST "$DEPLOY_WEBHOOK_URL" \
          -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
