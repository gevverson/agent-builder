name: Build and Test Agent Builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the code from the repository
    - uses: actions/checkout@v3
    
    # 2. Install Python 3.10 (Same as your local)
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    # 3. Install the libraries (Flask, Mem0, etc.)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
  
    - name: Test Run (Check if app initializes)
      run: |
        python -c "from app import create_app; print('App initialized successfully')"
      env:
        # Use the secret we just saved in GitHub settings
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}