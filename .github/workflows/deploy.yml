name: Build and Test Agent Builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Test Run (Check if app initializes)
      run: |
        # We verify that the app can start without crashing
        python -c "from app import create_app; print('App initialized successfully')"
      env:
        # This MUST match the name in GitHub Settings exactly
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}